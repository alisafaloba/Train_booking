<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Available Trains</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">TrainBooking</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/view-trains">View Trains</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">All Trains in the System</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover table-striped">
                <thead class="table-dark">
                <tr>
                    <th>Train ID</th>
                    <th>Name</th>
                    <th>Capacity</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="train : ${trains}">
                    <td th:text="${train.id}">1</td>
                    <td th:text="${train.name}">Express Train</td>
                    <td th:text="${train.capacity}">100</td>
                    <td>
                        <span th:if="${train.delayed}" class="badge bg-danger">Delayed</span>
                        <span th:unless="${train.delayed}" class="badge bg-success">On Time</span>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(trains)}" class="alert alert-warning text-center mt-3">
                No trains are currently available in the database.
            </div>
        </div>
    </div>
</div>

</body>
</html>
